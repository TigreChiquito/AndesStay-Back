spring:
  application:
    name: ms-andesstay-catalog

  datasource:
    url: jdbc:postgresql://localhost:5432/catalog_db
    username: andesstay
    password: ${DB_PASSWORD:andesstay}   # usa la env DB_PASSWORD si existe; si no, "andesstay"

  jpa:
    hibernate:
      ddl-auto: update          # crea/actualiza tablas solo en desarrollo
    open-in-view: false         # evita el anti-patrón OSIV (buena práctica)
    properties:
      hibernate:
        format_sql: true        # imprime el SQL ordenado y legible
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      batch-size: 32KB
      compression-type: lz4
      properties:
        spring.json.add.type.headers: false
        enable.idempotence: true
        linger.ms: 10
        # reservations llama a catalog con 5 s de timeout de lectura: si Kafka no
        # responde, el envío no puede comerse ese margen.
        max.block.ms: 1000
    admin:
      modify-topic-configs: true

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info    # expone /actuator/health para los healthchecks

# Muestra el SQL que ejecuta Hibernate (útil para aprender/debuggear)
logging:
  level:
    org.hibernate.SQL: DEBUG
