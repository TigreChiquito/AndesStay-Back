spring:
  application:
    name: ms-andesstay-reservations

  datasource:
    url: jdbc:postgresql://localhost:5432/reservations_db
    username: andesstay
    password: ${DB_PASSWORD:andesstay}   # usa la env DB_PASSWORD si existe; si no, "andesstay"

  jpa:
    hibernate:
      ddl-auto: update          # crea/actualiza tablas solo en desarrollo
    open-in-view: false         # evita el anti-patrón OSIV (buena práctica)
    properties:
      hibernate:
        format_sql: true        # imprime el SQL ordenado y legible
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # --- Mensajería: se activa cuando montemos el paquete messaging/ ---
  # Por ahora no hay listeners, así que el micro arranca sin Rabbit/Kafka.
  # Los defaults ya apuntan a localhost; verás WARN de conexión hasta que
  # esos servicios estén arriba (es inofensivo).
  # rabbitmq:
  #   host: localhost
  #   port: 5672
  # kafka:
  #   bootstrap-servers: localhost:9092

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info    # expone /actuator/health para los healthchecks

# Muestra el SQL que ejecuta Hibernate (útil para aprender/debuggear)
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE   # además, los valores de los parámetros (?)