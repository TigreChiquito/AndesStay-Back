spring:
  application:
    name: ms-andesstay-notify

  datasource:
    url: jdbc:postgresql://localhost:5432/notify_db
    username: andesstay
    password: ${DB_PASSWORD:andesstay}

  jpa:
    hibernate:
      ddl-auto: update          # crea/actualiza la tabla notifications
    open-in-view: false

  rabbitmq:
    host: localhost
    port: 5672
    username: andesstay
    password: ${RABBIT_PASSWORD:andesstay}
    listener:
      simple:
        acknowledge-mode: manual   # ACK/NACK explícitos en el código
        concurrency: 1             # consumidores mínimos por cola
        max-concurrency: 3         # escala hasta 3 si hay carga

server:
  port: 8083

# catalog: de aquí se sacan nombre, ubicación y tarifa de la unidad para el voucher
catalog:
  base-url: ${CATALOG_BASE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info